path: /home/shahdad/python/Projects/Tennis-Court-Visual-SLAM/keypoint_detection/dataset
train: train/images
val: val/images
test: test/images

# Keypoint configuration
kpt_shape: [8, 3]  # 8 keypoints, each with (x, y, visibility)

# Keypoint names (order matches label index)
names:
  0: left_pole_base
  1: left_pole_top
  2: right_pole_base
  3: right_pole_top
  4: service_line_center
  5: service_line_left
  6: baseline_center
  7: service_line_right

# Flipped keypoint pairs for horizontal augmentation
flip_idx: [2, 3, 0, 1, 4, 5, 7, 6]

# Skeleton for visualization (connections between keypoints)
skeleton:
  - [0, 1]  # Left pole base → top
  - [2, 3]  # Right pole base → top
  - [0, 2]  # Pole base line (net)
  - [4, 5]  # Service line center → left
  - [4, 7]  # Service line center → right
  - [5, 6]  # Service line left → baseline center
